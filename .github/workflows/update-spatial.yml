name: Refresh Experimental Spatial Map

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'

permissions:
  contents: write

concurrency:
  group: haorshield-spatial-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spatial forecast dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'requests>=2.31,<3' 'numpy==2.1.3' 'pandas==2.3.3' 'scikit-learn==1.6.1' 'joblib==1.6.0' 'geopandas>=0.14,<2' 'shapely>=2,<3' 'pyproj>=3,<4' 'pyarrow>=15,<25'
      - name: Regenerate spatial candidate map and summary
        run: python scripts/update_sar_spatial_forecast.py
      - name: Validate matched, current issue data
        run: python scripts/verify_spatial_pair.py
      - name: Commit BOTH validated outputs or neither
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/data/haorshield_sar_future_candidates.geojson frontend/public/data/haorshield_sar_future_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated experimental spatial map issue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Update HaorShield Rainfall Forecast

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: haorshield-rainfall-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests shapely pyproj

      - name: Refresh rainfall data
        run: python scripts/update_rainfall.py

      - name: Generate spatial cropland screening
        run: python scripts/update_cropland_screening.py
      - name: Update GloFAS hydrological exposure
        run: python scripts/update_glofas_exposure.py

      - name: Commit updated forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/haorshield_rainfall_risk.geojson
          git add frontend/public/data/haorshield_rainfall_summary.json
          git add frontend/public/data/haorshield_flood_screening.geojson
          git add frontend/public/data/haorshield_flood_screening_summary.json
          git add frontend/public/data/haorshield_cropland_rainfall_screening_summary.json
          git add frontend/public/data/haorshield_glofas_forecast.json frontend/public/data/haorshield_future_exposure_screening.geojson frontend/public/data/haorshield_future_exposure_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update HaorShield rainfall forecasts"
            git push
          fi
